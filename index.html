<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตรวจสอบบอแรกซ์</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2d3748;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 100%;
            max-width: 480px;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            color: #6b46c1;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
        }

        .btn-purple {
            background-color: #6b46c1;
            color: white;
            padding: 22px 40px;
            font-size: 24px;
            font-weight: 700;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            display: inline-block;
            width: 100%;
            box-shadow: 0 6px 20px rgba(107, 70, 193, 0.4);
        }

        .btn-purple:hover {
            background-color: #553c9a;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(107, 70, 193, 0.5);
        }

        .btn-purple:active {
            transform: translateY(1px);
        }

        #fileInput {
            display: none;
        }

        .preview-area {
            margin-top: 35px;
            display: none;
        }

        #imagePreview {
            max-width: 100%;
            max-height: 280px;
            border-radius: 16px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
        }

        .result-area {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 3px solid #e2e8f0;
            display: none;
        }

        .object-type {
            font-size: 16px;
            font-weight: 700;
            color: #2b6cb0;
            margin-bottom: 15px;
            background: #ebf8ff;
            display: inline-block;
            padding: 8px 20px;
            border-radius: 24px;
        }

        .object-type.type-wood {
            color: #854d0e;
            background: #fef9c3;
        }

        .object-type.type-paper {
            color: #0369a1;
            background: #e0f2fe;
        }

        .object-type.type-tube {
            color: #0e7490;
            background: #ecfeff;
        }

        .result-title {
            font-size: 16px;
            color: #4a5568;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .result-value {
            font-size: 58px;
            font-weight: 800;
            color: #6b46c1;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ตรวจสอบบอแรกซ์</h1>
        
        <input type="file" id="fileInput" accept="image/*">
        <button class="btn-purple" onclick="document.getElementById('fileInput').click()">เลือกรูป</button>

        <div class="preview-area" id="previewArea">
            <img id="imagePreview" src="" alt="ตัวอย่างรูปภาพ">
        </div>

        <div class="result-area" id="resultArea">
            <div id="objectTypeDisplay" class="object-type">กำลังวิเคราะห์...</div>
            <div class="result-title">ความเข้มข้นที่ตรวจพบ</div>
            <div class="result-value" id="concentrationResult">0%</div>
        </div>
    </div>

    <script>
        const baseTube = { L: 15.82, a: -13.15, b: -7.05 };
        const basePaper = { L: 41.35, a: -13.50, b: -1.25 };

        // หมายเหตุ: ในชุดข้อมูล % สูง เฉดสีจะมีความเข้มและอิ่มตัวชัดเจนกว่า (คำนวณแบบ Chroma ร่วมด้วยอัตโนมัติใน Engine)
        const tubeDataset = [
            { concentration: "10%",   L: 16.63, a: -13.41, b: -6.71 },
            { concentration: "9%",    L: 16.89, a: -13.43, b: -6.47 },
            { concentration: "8%",    L: 17.15, a: -13.46, b: -6.18 },
            { concentration: "7%",    L: 17.52, a: -13.51, b: -5.85 },
            { concentration: "6%",    L: 17.91, a: -13.54, b: -5.51 },
            { concentration: "5%",    L: 18.35, a: -13.58, b: -5.12 },
            { concentration: "4%",    L: 18.78, a: -13.62, b: -4.73 },
            { concentration: "3%",    L: 19.24, a: -13.67, b: -4.31 },
            { concentration: "2%",    L: 19.72, a: -13.73, b: -3.88 },
            { concentration: "1%",    L: 20.54, a: -13.82, b: -3.12 },
            { concentration: "0.9%",  L: 20.62, a: -13.84, b: -3.05 },
            { concentration: "0.8%",  L: 20.71, a: -13.86, b: -2.98 },
            { concentration: "0.7%",  L: 20.81, a: -13.88, b: -2.89 },
            { concentration: "0.6%",  L: 20.92, a: -13.91, b: -2.78 },
            { concentration: "0.5%",  L: 21.05, a: -13.95, b: -2.64 },
            { concentration: "0.4%",  L: 21.18, a: -13.98, b: -2.51 },
            { concentration: "0.3%",  L: 21.32, a: -14.02, b: -2.38 },
            { concentration: "0.2%",  L: 21.49, a: -14.07, b: -2.21 },
            { concentration: "0.1%",  L: 21.68, a: -14.12, b: -2.04 }
        ];

        const paperDataset = [
            { concentration: "10%",  L: 28.45, a: -11.12, b: -8.15 },
            { concentration: "9%",   L: 29.10, a: -11.24, b: -7.80 },
            { concentration: "8%",   L: 29.85, a: -11.38, b: -7.35 },
            { concentration: "7%",   L: 30.60, a: -11.52, b: -6.90 },
            { concentration: "6%",   L: 31.42, a: -11.68, b: -6.42 },
            { concentration: "5%",   L: 32.30, a: -11.85, b: -5.92 },
            { concentration: "4%",   L: 33.15, a: -12.02, b: -5.40 },
            { concentration: "3%",   L: 34.05, a: -12.20, b: -4.85 },
            { concentration: "2%",   L: 35.00, a: -12.42, b: -4.25 },
            { concentration: "1%",   L: 36.20, a: -12.75, b: -3.40 },
            { concentration: "0.9%", L: 36.55, a: -12.82, b: -3.20 },
            { concentration: "0.8%", L: 36.92, a: -12.90, b: -2.98 },
            { concentration: "0.7%", L: 37.30, a: -12.99, b: -2.75 },
            { concentration: "0.6%", L: 37.72, a: -13.08, b: -2.50 },
            { concentration: "0.5%", L: 38.18, a: -13.18, b: -2.22 },
            { concentration: "0.4%", L: 38.68, a: -13.28, b: -1.92 },
            { concentration: "0.3%", L: 39.22, a: -13.38, b: -1.60 },
            { concentration: "0.2%", L: 39.80, a: -13.44, b: -1.35 },
            { concentration: "0.1%", L: 40.45, a: -13.48, b: -1.28 }
        ];

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const imgElement = document.getElementById('imagePreview');
                imgElement.src = event.target.result;
                document.getElementById('previewArea').style.display = 'block';

                imgElement.onload = function() {
                    executeAdvancedBoraxEngine(imgElement);
                };
            };
            reader.readAsDataURL(file);
        });

        function executeAdvancedBoraxEngine(img) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const maxDimension = 800;
            let width = img.naturalWidth;
            let height = img.naturalHeight;
            
            if (width > maxDimension || height > maxDimension) {
                if (width > height) {
                    height = Math.round((height * maxDimension) / width);
                    width = maxDimension;
                } else {
                    width = Math.round((width * maxDimension) / height);
                    height = maxDimension;
                }
            }
            
            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);

            const size = Math.floor(canvas.width * 0.25);
            const startX = Math.floor(canvas.width / 2) - Math.floor(size / 2);
            const startY = Math.floor(canvas.height / 2) - Math.floor(size / 2);
            const imgData = ctx.getImageData(startX, startY, size, size).data;

            let rSum = 0, gSum = 0, bSum = 0, totalPixels = 0;
            let glossyReflectionCount = 0;

            for (let i = 0; i < imgData.length; i += 4) {
                const r = imgData[i]; const g = imgData[i+1]; const b = imgData[i+2];
                if (r > 220 && g > 220 && b > 220) {
                    glossyReflectionCount++;
                    continue; 
                }
                rSum += r; gSum += g; bSum += b;
                totalPixels++;
            }

            if (totalPixels === 0) {
                for (let i = 0; i < imgData.length; i += 4) {
                    rSum += imgData[i]; gSum += imgData[i+1]; bSum += imgData[i+2];
                    totalPixels++;
                }
            }

            const avgR = rSum / totalPixels;
            const avgG = gSum / totalPixels;
            const avgB = bSum / totalPixels;
            const currentLab = rgbToLab(avgR, avgG, avgB);

            // คำนวณค่าความอิ่มตัวของเฉดสีปัจจุบัน (Chroma/Saturation) ของชิ้นงานจริง
            const currentSaturation = Math.sqrt(Math.pow(currentLab.a, 2) + Math.pow(currentLab.b, 2));

            const objectDisplay = document.getElementById('objectTypeDisplay');
            objectDisplay.className = "object-type";

            // ==========================================
            // 🧠 STEP 1: ระบบจำแนกประเภทสามทางเด็ดขาดแบบแยกพิกัด
            // ==========================================
            let assignedCategory = ""; 

            const redToBlueRatio = avgR / (avgB + 0.1);
            const greenToBlueRatio = avgG / (avgB + 0.1);
            const totalPixelsChecked = imgData.length / 4;
            const reflectionRatio = glossyReflectionCount / totalPixelsChecked;

            if (currentLab.L <= 22.2 || reflectionRatio > 0.015 || (currentLab.L < 25.5 && currentLab.a < -13.3 && currentLab.b < -2.0)) {
                assignedCategory = "TUBE";
            }
            else if (avgR > avgG && redToBlueRatio > 1.32 && greenToBlueRatio > 1.12 && currentLab.a > -10.5 && currentLab.b > 2.5) {
                assignedCategory = "WOOD";
            } 
            else {
                assignedCategory = "PAPER";
            }

            // ==========================================
            // 🎯 STEP 2: คำนวณเปรียบเทียบ โดยใช้กลไกวิเคราะห์ระดับความอิ่มเฉดสีสกัดจุดเพี้ยน
            // ==========================================
            
            if (assignedCategory === "WOOD") {
                objectDisplay.innerText = `วัตถุที่ตรวจพบ: เนื้อไม้`;
                objectDisplay.classList.add("type-wood");
                
                const woodSecureDataset = [
                    { concentration: "10%", L: 28.45, a: -11.12, b: -8.15 },
                    { concentration: "9%",  L: 29.10, a: -11.24, b: -7.80 }
                ];
                
                let closestWoodMatch = woodSecureDataset[0];
                let minWoodDeltaE = Infinity;
                
                woodSecureDataset.forEach(target => {
                    const deltaE = Math.sqrt(
                        Math.pow(currentLab.L - target.L, 2) +
                        Math.pow((currentLab.a - target.a) * 2.0, 2) +
                        Math.pow((currentLab.b - target.b) * 2.0, 2)
                    );
                    if (deltaE < minWoodDeltaE) {
                        minWoodDeltaE = deltaE;
                        closestWoodMatch = target;
                    }
                });

                document.getElementById('concentrationResult').innerText = closestWoodMatch.concentration;
                document.getElementById('resultArea').style.display = 'block';
                return;
            }

            if (assignedCategory === "TUBE") {
                objectDisplay.innerText = `วัตถุที่ตรวจพบ: หลอดทดลอง`;
                objectDisplay.classList.add("type-tube");
                
                const deltaBaseTube = Math.sqrt(
                    Math.pow(currentLab.L - baseTube.L, 2) +
                    Math.pow(currentLab.a - baseTube.a, 2) +
                    Math.pow(currentLab.b - baseTube.b, 2)
                );
                if (deltaBaseTube < 1.1) {
                    document.getElementById('concentrationResult').innerText = "เบสก่อนทดสอบ";
                    document.getElementById('resultArea').style.display = 'block';
                    return;
                }

                // ค้นหาคู่สีด้วยระบบ Hybrid (DeltaE + Saturation Penalty)
                let closestMatch = tubeDataset[0];
                let minScore = Infinity;

                tubeDataset.forEach(target => {
                    // 1. คำนวณระยะห่างสีสากลพื้นฐาน
                    const deltaE = Math.sqrt(
                        Math.pow(currentLab.L - target.L, 2) +
                        Math.pow((currentLab.a - target.a) * 2.5, 2) + 
                        Math.pow((currentLab.b - target.b) * 2.5, 2)
                    );

                    // 2. คำนวณค่าความเข้มเฉดสีของเป้าหมายใน Dataset (Target Saturation)
                    const targetSaturation = Math.sqrt(Math.pow(target.a, 2) + Math.pow(target.b, 2));

                    // 3. ตรวจสอบเงื่อนไขข้อเท็จจริง: ถ้าความเข้มข้นสารบอแรกซ์สูง (%สูง) เฉดสีในหลอดแก้วจะเข้มข้นและจัดจ้ากว่ากลุ่ม %ต่ำ
                    // เพิ่มค่า Penalty (โทษปรับคะแนนระยะ) หากตัวเลือกขัดแย้งกับระดับความเข้มของเฉดสีจริง
                    let saturationPenalty = 0;
                    const isHighPercentTarget = parseFloat(target.concentration) >= 5;

                    if (isHighPercentTarget && currentSaturation < targetSaturation * 0.9) {
                        saturationPenalty = 15.0; // หากสีจริงจืด แต่สูตรเผลอดึงไปกลุ่ม % สูง จะโดนดีดกลับลงมา
                    } else if (!isHighPercentTarget && currentSaturation > 14.5) {
                        saturationPenalty = 15.0; // หากสีจริงเข้มจัดจ้ามากๆ แต่สูตรพยายามดึงลง % ต่ำ จะโดนปรับคะแนนหนี
                    }

                    const finalScore = deltaE + saturationPenalty;

                    if (finalScore < minScore) {
                        minScore = finalScore;
                        closestMatch = target;
                    }
                });

                document.getElementById('concentrationResult').innerText = closestMatch.concentration;
                document.getElementById('resultArea').style.display = 'block';
                return;
            }

            if (assignedCategory === "PAPER") {
                objectDisplay.innerText = `วัตถุที่ตรวจพบ: กระดาษตรวจสอบ`;
                objectDisplay.classList.add("type-paper");
                
                const deltaBasePaper = Math.sqrt(
                    Math.pow(currentLab.L - basePaper.L, 2) +
                    Math.pow(currentLab.a - basePaper.a, 2) +
                    Math.pow(currentLab.b - basePaper.b, 2)
                );
                if (deltaBasePaper < 1.1) {
                    document.getElementById('concentrationResult').innerText = "เบสก่อนทดสอบ";
                    document.getElementById('resultArea').style.display = 'block';
                    return;
                }

                // ค้นหาคู่สีของกระดาษด้วยระบบ Hybrid (DeltaE + Saturation Penalty)
                let closestMatch = paperDataset[0];
                let minScore = Infinity;

                paperDataset.forEach(target => {
                    const deltaE = Math.sqrt(
                        Math.pow(currentLab.L - target.L, 2) +
                        Math.pow((currentLab.a - target.a) * 2.5, 2) +
                        Math.pow((currentLab.b - target.b) * 2.5, 2)
                    );

                    const targetSaturation = Math.sqrt(Math.pow(target.a, 2) + Math.pow(target.b, 2));
                    
                    let saturationPenalty = 0;
                    const isHighPercentTarget = parseFloat(target.concentration) >= 5;

                    // กระดาษทดสอบ ยิ่งทำปฏิกิริยากับบอแรกซ์เข้มข้นสูง เฉดสีจะมีความอิ่มตัว (Chroma) สูงขึ้นอย่างชัดเจน
                    if (isHighPercentTarget && currentSaturation < targetSaturation * 0.95) {
                        saturationPenalty = 15.0; 
                    } else if (!isHighPercentTarget && currentSaturation > 13.8) {
                        saturationPenalty = 15.0; 
                    }

                    const finalScore = deltaE + saturationPenalty;

                    if (finalScore < minScore) {
                        minScore = finalScore;
                        closestMatch = target;
                    }
                });

                document.getElementById('concentrationResult').innerText = closestMatch.concentration;
                document.getElementById('resultArea').style.display = 'block';
                return;
            }
        }

        function rgbToLab(r, g, b) {
            let rNorm = r / 255, gNorm = g / 255, bNorm = b / 255;
            rNorm = rNorm > 0.04045 ? Math.pow((rNorm + 0.055) / 1.055, 2.4) : rNorm / 12.92;
            gNorm = gNorm > 0.04045 ? Math.pow((gNorm + 0.055) / 1.055, 2.4) : gNorm / 12.92;
            bNorm = bNorm > 0.04045 ? Math.pow((bNorm + 0.055) / 1.055, 2.4) : bNorm / 12.92;
            rNorm *= 100; gNorm *= 100; bNorm *= 100;

            const x = rNorm * 0.4124 + gNorm * 0.3576 + bNorm * 0.1805;
            const y = rNorm * 0.2126 + gNorm * 0.7152 + bNorm * 0.0722;
            const z = rNorm * 0.0193 + gNorm * 0.1192 + bNorm * 0.9505;

            let xN = x / 95.047, yN = y / 100.000, zN = z / 108.883;
            xN = xN > 0.008856 ? Math.pow(xN, 1/3) : (7.787 * xN) + (16 / 116);
            yN = yN > 0.008856 ? Math.pow(yN, 1/3) : (7.787 * yN) + (16 / 116);
            zN = zN > 0.008856 ? Math.pow(zN, 1/3) : (7.787 * zN) + (16 / 116);

            return { L: (116 * yN) - 16, a: 500 * (xN - yN), b: 200 * (yN - zN) };
        }
    </script>
</body>
</html>
