<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตรวจสอบบอแรกซ์</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2d3748;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 100%;
            max-width: 480px;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            color: #6b46c1;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
        }

        .btn-purple {
            background-color: #6b46c1;
            color: white;
            padding: 22px 40px;
            font-size: 24px;
            font-weight: 700;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            display: inline-block;
            width: 100%;
            box-shadow: 0 6px 20px rgba(107, 70, 193, 0.4);
        }

        .btn-purple:hover {
            background-color: #553c9a;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(107, 70, 193, 0.5);
        }

        #fileInput {
            display: none;
        }

        .preview-area {
            margin-top: 35px;
            display: none;
        }

        #imagePreview {
            max-width: 100%;
            max-height: 280px;
            border-radius: 16px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
        }

        .result-area {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 3px solid #e2e8f0;
            display: none;
        }

        .object-type {
            font-size: 16px;
            font-weight: 700;
            color: #2b6cb0;
            margin-bottom: 15px;
            background: #ebf8ff;
            display: inline-block;
            padding: 8px 20px;
            border-radius: 24px;
        }

        .result-title {
            font-size: 16px;
            color: #4a5568;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .result-value {
            font-size: 58px;
            font-weight: 800;
            color: #6b46c1;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ตรวจสอบบอแรกซ์</h1>
        
        <input type="file" id="fileInput" accept="image/*">
        <button class="btn-purple" onclick="document.getElementById('fileInput').click()">เลือกรูป</button>

        <div class="preview-area" id="previewArea">
            <img id="imagePreview" src="" alt="ตัวอย่างรูปภาพ">
        </div>

        <div class="result-area" id="resultArea">
            <div id="objectTypeDisplay" class="object-type">กำลังวิเคราะห์...</div>
            <div class="result-title">ความเข้มข้นที่ตรวจพบ</div>
            <div class="result-value" id="concentrationResult">0%</div>
        </div>
    </div>

    <script>
        const baseTube = { L: 15.82, a: -13.15, b: -7.05 };
        const basePaper = { L: 41.35, a: -13.50, b: -1.25 };

        const tubeDataset = [
            { concentration: "10%",   L: 16.63, a: -13.41, b: -6.71 },
            { concentration: "9%",    L: 16.89, a: -13.43, b: -6.47 },
            { concentration: "8%",    L: 17.15, a: -13.46, b: -6.18 },
            { concentration: "7%",    L: 17.52, a: -13.51, b: -5.85 },
            { concentration: "6%",    L: 17.91, a: -13.54, b: -5.51 },
            { concentration: "5%",    L: 18.35, a: -13.58, b: -5.12 },
            { concentration: "4%",    L: 18.78, a: -13.62, b: -4.73 },
            { concentration: "3%",    L: 19.24, a: -13.67, b: -4.31 },
            { concentration: "2%",    L: 19.72, a: -13.73, b: -3.88 },
            { concentration: "1%",    L: 20.54, a: -13.82, b: -3.12 },
            { concentration: "0.9%",  L: 20.62, a: -13.84, b: -3.05 },
            { concentration: "0.8%",  L: 20.71, a: -13.86, b: -2.98 },
            { concentration: "0.7%",  L: 20.81, a: -13.88, b: -2.89 },
            { concentration: "0.6%",  L: 20.92, a: -13.91, b: -2.78 },
            { concentration: "0.5%",  L: 21.05, a: -13.95, b: -2.64 },
            { concentration: "0.4%",  L: 21.18, a: -13.98, b: -2.51 },
            { concentration: "0.3%",  L: 21.32, a: -14.02, b: -2.38 },
            { concentration: "0.2%",  L: 21.49, a: -14.07, b: -2.21 },
            { concentration: "0.1%",  L: 21.68, a: -14.12, b: -2.04 }
        ];

        const paperDataset = [
            { concentration: "10%",  L: 28.45, a: -11.12, b: -8.15 },
            { concentration: "9%",   L: 29.10, a: -11.24, b: -7.80 },
            { concentration: "8%",   L: 29.85, a: -11.38, b: -7.35 },
            { concentration: "7%",   L: 30.60, a: -11.52, b: -6.90 },
            { concentration: "6%",   L: 31.42, a: -11.68, b: -6.42 },
            { concentration: "5%",   L: 32.30, a: -11.85, b: -5.92 },
            { concentration: "4%",   L: 33.15, a: -12.02, b: -5.40 },
            { concentration: "3%",   L: 34.05, a: -12.20, b: -4.85 },
            { concentration: "2%",   L: 35.00, a: -12.42, b: -4.25 },
            { concentration: "1%",   L: 36.20, a: -12.75, b: -3.40 },
            { concentration: "0.9%", L: 36.55, a: -12.82, b: -3.20 },
            { concentration: "0.8%", L: 36.92, a: -12.90, b: -2.98 },
            { concentration: "0.7%", L: 37.30, a: -12.99, b: -2.75 },
            { concentration: "0.6%", L: 37.72, a: -13.08, b: -2.50 },
            { concentration: "0.5%", L: 38.18, a: -13.18, b: -2.22 },
            { concentration: "0.4%", L: 38.68, a: -13.28, b: -1.92 },
            { concentration: "0.3%", L: 39.22, a: -13.38, b: -1.60 },
            { concentration: "0.2%", L: 39.80, a: -13.44, b: -1.35 },
            { concentration: "0.1%", L: 40.45, a: -13.48, b: -1.28 }
        ];

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const imgElement = document.getElementById('imagePreview');
                imgElement.src = event.target.result;
                document.getElementById('previewArea').style.display = 'block';

                imgElement.onload = function() {
                    executePreciseEngine(imgElement);
                };
            };
            reader.readAsDataURL(file);
        });

        function executePreciseEngine(img) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            ctx.drawImage(img, 0, 0);

            const size = Math.floor(canvas.width * 0.20);
            const startX = Math.floor(canvas.width / 2) - Math.floor(size / 2);
            const startY = Math.floor(canvas.height / 2) - Math.floor(size / 2);
            const imgData = ctx.getImageData(startX, startY, size, size).data;

            let rSum = 0, gSum = 0, bSum = 0, validCount = 0;
            let whiteReflection = 0;

            for (let i = 0; i < imgData.length; i += 4) {
                const r = imgData[i]; const g = imgData[i+1]; const b = imgData[i+2];
                
                if (r > 230 && g > 230 && b > 230) {
                    whiteReflection++;
                    continue; 
                }
                rSum += r; gSum += g; bSum += b;
                validCount++;
            }

            if (validCount === 0) { validCount = 1; }

            const currentLab = rgbToLab(rSum / validCount, gSum / validCount, bSum / validCount);

            let isPaper = false;
            let objectTypeLabel = "หลอดทดลอง";

            if (currentLab.L > 24.5 && whiteReflection < (imgData.length / 4 * 0.06)) {
                isPaper = true;
                objectTypeLabel = "กระดาษตรวจสอบ";
            }

            const activeBaseline = isPaper ? basePaper : baseTube;
            const distToBase = Math.sqrt(
                Math.pow(currentLab.L - activeBaseline.L, 2) +
                Math.pow(currentLab.a - activeBaseline.a, 2) +
                Math.pow(currentLab.b - activeBaseline.b, 2)
            );

            if (distToBase < 1.2) {
                document.getElementById('objectTypeDisplay').innerText = `วัตถุที่ตรวจพบ: ${objectTypeLabel}`;
                document.getElementById('concentrationResult').innerText = "0%";
                document.getElementById('resultArea').style.display = 'block';
                return;
            }

            const activeDataset = isPaper ? paperDataset : tubeDataset;

            // คำนวณช่วง Min/Max ของ Dataset เพื่อทำ Feature Scaling
            let minL = Infinity, maxL = -Infinity;
            let minA = Infinity, maxA = -Infinity;
            let minB = Infinity, maxB = -Infinity;

            activeDataset.forEach(d => {
                if (d.L < minL) minL = d.L; if (d.L > maxL) maxL = d.L;
                if (d.a < minA) minA = d.a; if (d.a > maxA) maxA = d.a;
                if (d.b < minB) minB = d.b; if (d.b > maxB) maxB = d.b;
            });

            const rangeL = (maxL - minL) || 1;
            const rangeA = (maxA - minA) || 1;
            const rangeB = (maxB - minB) || 1;

            // Normalize ค่าปัจจุบัน
            const normL = (currentLab.L - minL) / rangeL;
            const normA = (currentLab.a - minA) / rangeA;
            const normB = (currentLab.b - minB) / rangeB;

            let closestMatch = activeDataset[0];
            let minDistance = Infinity;

            activeDataset.forEach(target => {
                const targetNormL = (target.L - minL) / rangeL;
                const targetNormA = (target.a - minA) / rangeA;
                const targetNormB = (target.b - minB) / rangeB;

                const distance = Math.sqrt(
                    Math.pow(normL - targetNormL, 2) +
                    Math.pow(normA - targetNormA, 2) +
                    Math.pow(normB - targetNormB, 2)
                );

                if (distance < minDistance) {
                    minDistance = distance;
                    closestMatch = target;
                }
            });

            document.getElementById('objectTypeDisplay').innerText = `วัตถุที่ตรวจพบ: ${objectTypeLabel}`;
            document.getElementById('concentrationResult').innerText = closestMatch.concentration;
            document.getElementById('resultArea').style.display = 'block';
        }

        function rgbToLab(r, g, b) {
            let rNorm = r / 255, gNorm = g / 255, bNorm = b / 255;
            rNorm = rNorm > 0.04045 ? Math.pow((rNorm + 0.055) / 1.055, 2.4) : rNorm / 12.92;
            gNorm = gNorm > 0.04045 ? Math.pow((gNorm + 0.055) / 1.055, 2.4) : gNorm / 12.92;
            bNorm = bNorm > 0.04045 ? Math.pow((bNorm + 0.055) / 1.055, 2.4) : bNorm / 12.92;
            rNorm *= 100; gNorm *= 100; bNorm *= 100;

            const x = rNorm * 0.4124 + gNorm * 0.3576 + bNorm * 0.1805;
            const y = rNorm * 0.2126 + gNorm * 0.7152 + bNorm * 0.0722;
            const z = rNorm * 0.0193 + gNorm * 0.1192 + bNorm * 0.9505;

            let xN = x / 95.047, yN = y / 100.000, zN = z / 108.883;
            xN = xN > 0.008856 ? Math.pow(xN, 1/3) : (7.787 * xN) + (16 / 116);
            yN = yN > 0.008856 ? Math.pow(yN, 1/3) : (7.787 * yN) + (16 / 116);
            zN = zN > 0.008856 ? Math.pow(zN, 1/3) : (7.787 * zN) + (16 / 116);

            return { L: (116 * yN) - 16, a: 500 * (xN - yN), b: 200 * (yN - zN) };
        }
    </script>
</body>
</html>
